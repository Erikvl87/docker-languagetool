name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'Dockerfile'
      - 'arm64-workaround/**'
      - 'maven/**'
    tags-ignore: # Exclude the release tags since they trigger a dedicated release action.
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+-dockerupdate-[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-dockerupdate-[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    # The build stage may come from the cache that the Build and Scan
    # workflows write, but the tests always run (no-cache-filters).
    - name: Build and run tests
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: test-results
        outputs: type=local,dest=test-results
        no-cache-filters: test
        cache-from: type=gha,scope=image
    - name: Check test result
      run: exit "$(cat test-results/exit-code)"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: surefire-reports
        path: test-results/
