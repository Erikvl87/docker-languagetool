name: Release

on:
  workflow_dispatch:
    inputs:
        skip_tests:
          type: boolean
          description: Skip the tests
          required: true
          default: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+-dockerupdate-[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-dockerupdate-[0-9]+'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Releases never use a cache from earlier runs. The push step below runs
      # in the same builder, so it reuses the build stage from this step
      # instead of building LanguageTool a second time.
      - name: Build and test
        if:  ${{ inputs.skip_tests == null || inputs.skip_tests == false }}
        run: |
          docker buildx build --no-cache --target=test-results --output type=local,dest=test-results .
          exit "$(cat test-results/exit-code)"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: test-results/
      - name: Tag
        run: |
          echo 'DOCKER_TAG<<EOF' >> "$GITHUB_ENV"
          echo "$(echo "$GITHUB_REF" | grep -oP '(?<=refs/tags/v).*')" >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"
      - name: Login to Docker Hub
        run: echo "$DOCKERHUB_ACCESSTOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ACCESSTOKEN: ${{ secrets.DOCKERHUB_ACCESSTOKEN }}
      - name: Push to Docker Hub
        run: |
          docker buildx build --push \
            --no-cache-filter runtime \
            --tag $DOCKERHUB_REPOSITORY:$DOCKER_TAG \
            --tag $DOCKERHUB_REPOSITORY:latest \
            --platform linux/amd64,linux/arm64 .
        env:
          DOCKERHUB_REPOSITORY: erikvl87/languagetool
      # - name: Push to GitHub Packages
      #   run: |
      #     docker tag languagetool docker.pkg.github.com/${{ github.repository }}/languagetool:$DOCKER_TAG
      #     docker tag languagetool docker.pkg.github.com/${{ github.repository }}/languagetool:latest
      #     docker login docker.pkg.github.com -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
      #     docker push docker.pkg.github.com/${{ github.repository }}/languagetool:$DOCKER_TAG